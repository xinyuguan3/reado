<!DOCTYPE html>

<html class="dark" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>reado: 困在算法里的骑手 - 极限派送模拟界面</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f4e225", // Bright Yellow
                        "primary-dark": "#d9c81f",
                        "danger": "#ef4444", // Warning Red
                        "background-light": "#f8f8f5",
                        "background-dark": "#1a1915", // Darker for immersive feel
                        "surface-dark": "#2a2924",
                        "surface-highlight": "#3a3830",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "Noto Sans SC", "sans-serif"],
                        "body": ["Noto Sans SC", "sans-serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem", 
                        "lg": "0.5rem", 
                        "xl": "0.75rem", 
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Custom map background pattern */
        .map-bg {
            background-color: #1a1915;
            background-image: 
                linear-gradient(rgba(244, 226, 37, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(244, 226, 37, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        
        .grid-city {
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 10h80v80h-80z' fill='none' stroke='%23333' stroke-width='2'/%3E%3Cpath d='M30 30h40v40h-40z' fill='none' stroke='%232a2924' stroke-width='1'/%3E%3C/svg%3E");
            background-size: 200px 200px;
        }

        /* Glitch effect for warning text */
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
        .warning-text {
            animation: glitch 0.5s infinite;
            text-shadow: 2px 0 #ef4444, -2px 0 blue;
        }
        
        /* Pulse for danger zones */
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .danger-zone {
            animation: pulse-border 2s infinite;
        }
    </style>
</head>
<body class="font-body text-slate-900 dark:text-slate-100 bg-background-light dark:bg-background-dark overflow-hidden h-screen w-screen flex flex-col relative selection:bg-primary selection:text-black">
<!-- Map Background Layer -->
<div class="absolute inset-0 z-0 map-bg grid-city opacity-60 pointer-events-none" data-alt="Wireframe dark city map background" data-location="Beijing" style=""></div>
<!-- HUD Overlay Container -->
<div class="relative z-10 flex flex-col h-full w-full p-4 md:p-8 justify-between pointer-events-none">
<!-- Top Stats Bar -->
<div class="flex justify-between items-start pointer-events-auto w-full">
<!-- Left: Rider Phone UI Simulation -->
<div class="flex flex-col gap-4 max-w-[320px] w-full bg-surface-dark/90 backdrop-blur-md rounded-xl border border-white/10 shadow-2xl overflow-hidden">
<!-- Header -->
<div class="bg-primary px-4 py-3 flex justify-between items-center text-black">
<span class="font-bold text-sm tracking-wide">美团众包</span>
<span class="material-symbols-outlined text-lg">wifi</span>
</div>
<!-- Main Stats -->
<div class="p-5 flex flex-col gap-5">
<!-- Timer -->
<div class="flex justify-between items-end border-b border-white/10 pb-4">
<div class="flex flex-col">
<span class="text-xs text-slate-400 font-medium mb-1 uppercase tracking-wider">剩余时间</span>
<span class="text-3xl font-display font-bold text-danger animate-pulse">00:28</span>
</div>
<span class="material-symbols-outlined text-danger text-3xl">timer</span>
</div>
<!-- Money & Rating -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col">
<span class="text-xs text-slate-400 font-medium mb-1">预计收入</span>
<div class="flex items-baseline gap-1">
<span class="text-xl font-bold font-display text-primary">3.5</span>
<span class="text-xs text-slate-400">元</span>
</div>
</div>
<div class="flex flex-col items-end">
<span class="text-xs text-slate-400 font-medium mb-1">骑手评价</span>
<div class="flex items-center gap-1 text-primary">
<span class="text-xl font-bold font-display">4.9</span>
<span class="material-symbols-outlined text-sm filled">star</span>
</div>
</div>
</div>
</div>
<!-- Active Order Info -->
<div class="bg-surface-highlight/50 px-5 py-3 flex items-center justify-between border-t border-white/5">
<div class="flex items-center gap-3">
<div class="bg-primary/20 p-2 rounded-lg text-primary">
<span class="material-symbols-outlined">two_wheeler</span>
</div>
<div class="flex flex-col">
<span class="text-xs text-white font-medium">距离终点</span>
<span class="text-sm text-slate-400">1.2 km</span>
</div>
</div>
<button class="bg-primary text-black text-xs font-bold px-3 py-1.5 rounded hover:bg-primary-dark transition-colors">
                        详情
                    </button>
</div>
</div>
<!-- Top Center: Daily Goals -->
<div class="flex gap-4 pointer-events-auto hidden md:flex">
<div class="flex items-center gap-4 bg-surface-dark/80 backdrop-blur-sm px-6 py-3 rounded-full border border-white/10 shadow-lg">
<div class="flex flex-col items-center">
<span class="text-[10px] text-slate-400 uppercase tracking-widest">今日目标</span>
<span class="text-lg font-bold font-display text-white">0/7 <span class="text-xs text-slate-500 font-normal">单</span></span>
</div>
<div class="h-8 w-px bg-white/10"></div>
<div class="flex flex-col items-center">
<span class="text-[10px] text-slate-400 uppercase tracking-widest">当前余额</span>
<span class="text-lg font-bold font-display text-primary">0.00 <span class="text-xs text-slate-500 font-normal">元</span></span>
</div>
</div>
</div>
<!-- Right: System Controls (Map) -->
<div class="flex flex-col gap-2 pointer-events-auto">
<button class="size-12 bg-surface-dark/90 hover:bg-surface-highlight text-white rounded-lg flex items-center justify-center border border-white/10 shadow-lg transition-all group">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">layers</span>
</button>
<button class="size-12 bg-surface-dark/90 hover:bg-surface-highlight text-white rounded-lg flex items-center justify-center border border-white/10 shadow-lg transition-all group">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">my_location</span>
</button>
<div class="flex flex-col mt-2 rounded-lg overflow-hidden border border-white/10 shadow-lg">
<button class="size-10 bg-surface-dark/90 hover:bg-surface-highlight text-white flex items-center justify-center border-b border-white/10">
<span class="material-symbols-outlined text-sm">add</span>
</button>
<button class="size-10 bg-surface-dark/90 hover:bg-surface-highlight text-white flex items-center justify-center">
<span class="material-symbols-outlined text-sm">remove</span>
</button>
</div>
</div>
</div>
<!-- Center: Balance Meter (Floating) -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-4 pointer-events-none">
<!-- Simulated Character Marker (For visual context, usually this would be canvas) -->
<div class="relative size-16 flex items-center justify-center z-0 mb-8">
<div class="absolute inset-0 bg-primary/20 rounded-full animate-ping"></div>
<div class="relative z-10 bg-primary text-black p-3 rounded-full shadow-[0_0_20px_rgba(244,226,37,0.4)] border-2 border-white">
<span class="material-symbols-outlined text-2xl">delivery_dining</span>
</div>
<!-- Direction Cone -->
<div class="absolute -top-10 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[20px] border-l-transparent border-r-[20px] border-r-transparent border-b-[40px] border-b-primary/30 blur-[2px]"></div>
</div>
<!-- Balance Meter UI -->
<div class="bg-surface-dark/60 backdrop-blur-sm p-4 rounded-xl border border-white/10 flex flex-col items-center gap-2 w-64">
<div class="flex justify-between w-full text-xs font-medium text-slate-300">
<span>餐盒平衡计</span>
<span class="text-danger">⚠️ 警告</span>
</div>
<!-- Liquid Simulation Bar -->
<div class="w-full h-3 bg-black/50 rounded-full overflow-hidden relative border border-white/5">
<!-- The liquid moving left/right -->
<div class="absolute top-0 bottom-0 w-8 bg-danger rounded-full left-1/2 -translate-x-1/2 shadow-[0_0_10px_rgba(239,68,68,0.8)] transition-all duration-75" style="left: 80%;"></div>
<!-- Center Marker -->
<div class="absolute top-0 bottom-0 left-1/2 w-0.5 bg-white/30 -translate-x-1/2"></div>
</div>
<div class="text-[10px] text-danger font-mono tracking-tight animate-pulse">汤汁即将洒出 (持续晃动 &gt; 2s)</div>
</div>
</div>
<!-- Bottom: Alerts & Actions -->
<div class="flex flex-col items-center justify-end w-full pb-8 pointer-events-none">
<!-- System Alert Banner -->
<div class="mb-6 bg-danger/10 backdrop-blur-md border border-danger/40 text-danger px-6 py-3 rounded-full flex items-center gap-3 shadow-[0_0_30px_rgba(239,68,68,0.2)] danger-zone">
<span class="material-symbols-outlined animate-pulse">warning</span>
<span class="font-display font-bold tracking-wide">算法监测到最优路线，请加速</span>
</div>
<!-- Simulated Waypoints (Visual Indicators floating in UI space) -->
<div class="absolute bottom-20 left-20 pointer-events-auto">
<div class="flex items-center gap-2 group cursor-pointer">
<div class="bg-surface-dark p-2 rounded-lg border border-white/10 group-hover:bg-primary group-hover:text-black transition-colors">
<span class="material-symbols-outlined">storefront</span>
</div>
<div class="bg-surface-dark px-3 py-1 rounded text-xs text-white border border-white/10">取餐点 A (200m)</div>
</div>
</div>
<div class="absolute top-1/3 right-20 pointer-events-auto">
<div class="flex items-center gap-2 flex-row-reverse group cursor-pointer">
<div class="bg-danger p-2 rounded-lg border border-white/10 text-white animate-bounce shadow-lg shadow-danger/20">
<span class="material-symbols-outlined">home_pin</span>
</div>
<div class="bg-surface-dark px-3 py-1 rounded text-xs text-white border border-white/10">送餐点 B (待取餐)</div>
</div>
</div>
</div>
</div>
<!-- Screen Vignette & Scanlines for atmosphere -->
<div class="absolute inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,transparent_0%,rgba(0,0,0,0.4)_100%)]"></div>
<div class="absolute inset-0 pointer-events-none opacity-[0.03] bg-[linear-gradient(rgba(18,16,11,0)_50%,rgba(0,0,0,0.25)_50%),linear-gradient(90deg,rgba(255,0,0,0.06),rgba(0,255,0,0.02),rgba(0,0,255,0.06))] bg-[length:100%_2px,3px_100%] bg-repeat z-20"></div>
</body></html>
