<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reado Profile Setup</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-soft: #111c34;
      --panel: rgba(16, 24, 40, 0.9);
      --line: rgba(148, 163, 184, 0.25);
      --line-strong: rgba(125, 175, 255, 0.42);
      --text: #e5edff;
      --muted: #9fb0cc;
      --primary: #2563eb;
      --primary-strong: #1d4ed8;
      --danger: #ef4444;
      --ok: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 12%, rgba(37, 99, 235, 0.2), transparent 45%),
        radial-gradient(circle at 90% 8%, rgba(34, 197, 94, 0.12), transparent 34%),
        linear-gradient(180deg, #0f172a, #111c34 56%, #0f172a);
      display: flex;
      flex-direction: column;
    }
    .topbar {
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(15, 23, 42, 0.76);
      backdrop-filter: blur(10px);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(88, 173, 255, 0.4);
      background: rgba(19, 91, 236, 0.16);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #aecdff;
      font-family: "Material Icons";
      font-size: 20px;
      line-height: 1;
      font-weight: 400;
    }
    .top-link {
      color: #cfe0ff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(15, 23, 42, 0.35);
    }
    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }
    .setup-card {
      width: min(100%, 560px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 24px 50px rgba(2, 8, 23, 0.42);
      backdrop-filter: blur(10px);
      padding: 22px;
      display: grid;
      gap: 14px;
    }
    .eyebrow {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 800;
      color: #86b6ff;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -0.02em;
      font-weight: 800;
    }
    .subtitle,
    .session-email {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
    .session-email {
      font-size: 13px;
    }
    .avatar-preview-wrap {
      display: grid;
      place-items: center;
      padding: 8px 0 4px;
    }
    .avatar-preview {
      width: 84px;
      height: 84px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow: 0 10px 24px rgba(2, 8, 23, 0.35);
      object-fit: cover;
    }
    .picker-title {
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 700;
      color: #aac4ec;
    }
    .picker-grid {
      display: grid;
      gap: 8px;
    }
    .icon-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .color-grid {
      grid-template-columns: repeat(6, minmax(0, 1fr));
    }
    .picker-btn {
      border: 1px solid rgba(148, 163, 184, 0.36);
      border-radius: 12px;
      min-height: 52px;
      background: rgba(15, 23, 42, 0.6);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: border-color 120ms ease, transform 120ms ease, background 120ms ease;
      color: #e7efff;
    }
    .picker-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(152, 205, 255, 0.7);
      background: rgba(30, 64, 175, 0.24);
    }
    .picker-btn.is-active {
      border-color: rgba(125, 175, 255, 0.9);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2) inset;
      background: rgba(30, 64, 175, 0.28);
    }
    .picker-btn svg {
      width: 24px;
      height: 24px;
      stroke: #e8f1ff;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .color-dot {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.28);
    }
    .setup-form {
      display: grid;
      gap: 10px;
    }
    .name-input {
      width: 100%;
      min-height: 46px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.42);
      background: rgba(15, 23, 42, 0.62);
      color: #e5edff;
      font-size: 16px;
      padding: 0 14px;
      outline: none;
    }
    .name-input::placeholder {
      color: #91a6c7;
    }
    .name-input:focus {
      border-color: rgba(125, 175, 255, 0.88);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }
    .save-btn {
      border: 1px solid rgba(125, 175, 255, 0.7);
      border-radius: 12px;
      min-height: 46px;
      width: 100%;
      background: linear-gradient(180deg, var(--primary), var(--primary-strong));
      color: #e5edff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 120ms ease;
    }
    .save-btn:hover {
      transform: translateY(-1px);
    }
    .save-btn[disabled] {
      opacity: 0.66;
      cursor: not-allowed;
      transform: none;
    }
    .status {
      min-height: 20px;
      margin: 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }
    .status.success { color: var(--ok); }
    .status.error { color: var(--danger); }
    @media (max-width: 640px) {
      .topbar {
        height: 64px;
        padding: 0 12px;
      }
      .brand {
        font-size: 32px;
      }
      .brand-mark {
        width: 30px;
        height: 30px;
        font-size: 17px;
      }
      .setup-card {
        border-radius: 16px;
        padding: 18px;
      }
      h1 {
        font-size: 24px;
      }
      .icon-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .color-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
    }
  </style>
  <script defer src="https://umami-production-9f03.up.railway.app/script.js" data-website-id="a7e6844a-97e6-4878-bf40-5a18520d1310"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/pages/gamified-learning-hub-dashboard-1.html" aria-label="reado home">
      <span class="brand-mark">auto_stories</span>
      <span>reado</span>
    </a>
    <a class="top-link" href="/pages/gamified-learning-hub-dashboard-1.html">Back to app</a>
  </header>

  <main>
    <section class="setup-card" aria-label="Profile Setup">
      <p class="eyebrow">Profile setup</p>
      <h1>Set up your profile</h1>
      <p class="subtitle">Only once for new users. This name and avatar are used on leaderboard.</p>
      <p id="sessionEmail" class="session-email"></p>

      <div class="avatar-preview-wrap">
        <img id="avatarPreview" class="avatar-preview" src="" alt="Avatar preview">
      </div>

      <div>
        <p class="picker-title">Icon</p>
        <div id="avatarIconGrid" class="picker-grid icon-grid"></div>
      </div>

      <div>
        <p class="picker-title">Background</p>
        <div id="avatarColorGrid" class="picker-grid color-grid"></div>
      </div>

      <form id="setupForm" class="setup-form">
        <input id="setupNameInput" class="name-input" type="text" maxlength="24" placeholder="Your display name" required>
        <button id="setupSaveBtn" class="save-btn" type="submit">Save and continue</button>
      </form>

      <p id="statusText" class="status"></p>
    </section>
  </main>

  <script type="module">
    const AUTH_STATE_KEY = "reado_auth_state_v1";
    const USER_STATE_KEY = "reado_user_state_v1";
    const PROFILE_SETUP_KEY = "reado_profile_setup_v1";
    const FALLBACK_NEXT = "/pages/gamified-learning-hub-dashboard-1.html";
    const DEFAULT_SIGNUP_CREDITS = 500;

    const params = new URLSearchParams(window.location.search);
    const intent = String(params.get("intent") || "").trim();
    const pendingPriceId = String(params.get("priceId") || "").trim();

    const sessionEmailEl = document.getElementById("sessionEmail");
    const statusTextEl = document.getElementById("statusText");
    const avatarPreviewEl = document.getElementById("avatarPreview");
    const avatarIconGridEl = document.getElementById("avatarIconGrid");
    const avatarColorGridEl = document.getElementById("avatarColorGrid");
    const setupForm = document.getElementById("setupForm");
    const setupNameInput = document.getElementById("setupNameInput");
    const setupSaveBtn = document.getElementById("setupSaveBtn");

    let selectedAvatar = "";
    let selectedIconId = "spark";
    let selectedBgId = "ocean";

    const ICON_PRESETS = [
      {
        id: "spark",
        label: "Spark",
        template: "<path d='M64 28v16' stroke='{{color}}'/><path d='M64 84v16' stroke='{{color}}'/><path d='M28 64h16' stroke='{{color}}'/><path d='M84 64h16' stroke='{{color}}'/><path d='M40 40l11 11' stroke='{{color}}'/><path d='M77 77l11 11' stroke='{{color}}'/><path d='M88 40L77 51' stroke='{{color}}'/><path d='M51 77L40 88' stroke='{{color}}'/>"
      },
      {
        id: "book",
        label: "Book",
        template: "<rect x='36' y='34' width='56' height='60' rx='9' stroke='{{color}}'/><path d='M56 34v60' stroke='{{color}}'/><path d='M64 50h20' stroke='{{color}}'/><path d='M64 62h20' stroke='{{color}}'/>"
      },
      {
        id: "target",
        label: "Target",
        template: "<circle cx='64' cy='64' r='28' stroke='{{color}}'/><circle cx='64' cy='64' r='14' stroke='{{color}}'/><circle cx='64' cy='64' r='4' fill='{{color}}' stroke='none'/>"
      },
      {
        id: "chat",
        label: "Chat",
        template: "<rect x='32' y='36' width='64' height='44' rx='12' stroke='{{color}}'/><path d='M52 80l-14 14v-14' stroke='{{color}}'/><path d='M46 54h36' stroke='{{color}}'/><path d='M46 66h24' stroke='{{color}}'/>"
      },
      {
        id: "bulb",
        label: "Bulb",
        template: "<path d='M45 55a19 19 0 1 1 38 0c0 8-4 13-9 18-3 3-4 6-4 9H58c0-3-1-6-4-9-5-5-9-10-9-18z' stroke='{{color}}'/><path d='M57 88h14' stroke='{{color}}'/><path d='M56 96h16' stroke='{{color}}'/>"
      },
      {
        id: "rocket",
        label: "Rocket",
        template: "<path d='M72 34c13 7 22 22 22 40l-23-3-19-19 3-23c6 0 12 2 17 5z' stroke='{{color}}'/><path d='M52 52L36 68' stroke='{{color}}'/><path d='M68 68L52 84' stroke='{{color}}'/><circle cx='72' cy='56' r='5' stroke='{{color}}'/>"
      },
      {
        id: "leaf",
        label: "Leaf",
        template: "<path d='M34 74c0-24 18-42 52-44 2 34-16 52-44 52-5 0-8-4-8-8z' stroke='{{color}}'/><path d='M44 74c12-8 22-18 31-31' stroke='{{color}}'/>"
      },
      {
        id: "flag",
        label: "Flag",
        template: "<path d='M44 30v68' stroke='{{color}}'/><path d='M44 34h42l-10 15 10 15H44' stroke='{{color}}'/>"
      }
    ];

    const BG_PRESETS = [
      { id: "ocean", label: "Ocean", start: "#1d4ed8", end: "#06b6d4" },
      { id: "violet", label: "Violet", start: "#7c3aed", end: "#ec4899" },
      { id: "mint", label: "Mint", start: "#0f766e", end: "#34d399" },
      { id: "sunset", label: "Sunset", start: "#f97316", end: "#fb7185" },
      { id: "gold", label: "Gold", start: "#ca8a04", end: "#f59e0b" },
      { id: "forest", label: "Forest", start: "#166534", end: "#22c55e" },
      { id: "indigo", label: "Indigo", start: "#3730a3", end: "#6366f1" },
      { id: "slate", label: "Slate", start: "#0f172a", end: "#334155" },
      { id: "rose", label: "Rose", start: "#be123c", end: "#fb7185" },
      { id: "sky", label: "Sky", start: "#0369a1", end: "#38bdf8" },
      { id: "teal", label: "Teal", start: "#0f766e", end: "#2dd4bf" },
      { id: "grape", label: "Grape", start: "#6d28d9", end: "#a78bfa" }
    ];

    function setStatus(message, type = "") {
      statusTextEl.textContent = message || "";
      statusTextEl.className = "status" + (type ? " " + type : "");
    }

    function sanitizeNextPath(raw) {
      const value = String(raw || "").trim();
      if (!value) return FALLBACK_NEXT;
      try {
        const full = new URL(value, window.location.origin);
        if (full.origin !== window.location.origin) return FALLBACK_NEXT;
        return full.pathname + full.search + full.hash;
      } catch {
        return FALLBACK_NEXT;
      }
    }

    const nextPath = sanitizeNextPath(params.get("next"));

    function buildAuthUrl() {
      const url = new URL("/pages/auth.html", window.location.origin);
      url.searchParams.set("mode", "signin");
      url.searchParams.set("next", nextPath);
      if (intent === "checkout" && pendingPriceId) {
        url.searchParams.set("intent", "checkout");
        url.searchParams.set("priceId", pendingPriceId);
      }
      return url.toString();
    }

    function readAuthState() {
      try {
        const raw = JSON.parse(localStorage.getItem(AUTH_STATE_KEY) || "null");
        if (!raw || typeof raw !== "object") return null;
        const userId = typeof raw.userId === "string" ? raw.userId.trim() : "";
        const email = typeof raw.email === "string" ? raw.email.trim() : "";
        const expiresAt = Number(raw.expiresAt);
        if (Number.isFinite(expiresAt) && expiresAt > 0 && Date.now() > expiresAt) {
          localStorage.removeItem(AUTH_STATE_KEY);
          return null;
        }
        if (!userId) return null;
        return { userId, email, expiresAt };
      } catch {
        return null;
      }
    }

    function readUserState() {
      try {
        const raw = JSON.parse(localStorage.getItem(USER_STATE_KEY) || "null");
        return raw && typeof raw === "object" ? raw : {};
      } catch {
        return {};
      }
    }

    function writeUserState(state) {
      localStorage.setItem(USER_STATE_KEY, JSON.stringify(state));
    }

    function saveProfileSetup(payload) {
      localStorage.setItem(PROFILE_SETUP_KEY, JSON.stringify({
        userId: payload.userId,
        done: true,
        updatedAt: new Date().toISOString()
      }));
    }

    function hasProfileSetup(payload) {
      if (!payload?.userId) return false;
      try {
        const setup = JSON.parse(localStorage.getItem(PROFILE_SETUP_KEY) || "null");
        if (!setup || typeof setup !== "object") return false;
        if (setup.userId !== payload.userId || setup.done !== true) return false;
      } catch {
        return false;
      }
      const userState = readUserState();
      const name = String(userState?.name || "").trim();
      const avatar = String(userState?.avatar || "").trim();
      return Boolean(name && avatar);
    }

    async function syncRegisteredUser(authPayload, state, reason = "auth-profile-setup") {
      const userId = String(authPayload?.userId || "").trim();
      if (!userId) return null;
      const userState = state && typeof state === "object" ? state : readUserState();
      const body = {
        userId,
        email: String(authPayload?.email || "").trim(),
        displayName: String(userState?.name || "").trim(),
        state: {
          level: Number.isFinite(Number(userState?.level)) ? Math.max(1, Math.floor(Number(userState.level))) : 1,
          xp: Number.isFinite(Number(userState?.xp)) ? Math.max(0, Math.floor(Number(userState.xp))) : 0,
          gems: Number.isFinite(Number(userState?.gems)) ? Math.max(0, Math.floor(Number(userState.gems))) : 0
        },
        reason: String(reason || "").trim()
      };
      try {
        const response = await fetch("/api/user/sync", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify(body)
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data?.ok === false) return null;
        return data;
      } catch {
        return null;
      }
    }

    async function continueCheckoutIfNeeded() {
      if (intent !== "checkout" || !pendingPriceId) return false;
      const response = await fetch("/api/billing/checkout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ priceId: pendingPriceId })
      });
      let data = {};
      try { data = await response.json(); } catch {}
      if (!response.ok || data?.ok === false) {
        throw new Error(data?.error || `Checkout failed with ${response.status}`);
      }
      const checkoutUrl = String(data?.checkoutUrl || "").trim();
      if (!checkoutUrl) throw new Error("Stripe checkout URL is empty");
      window.location.assign(checkoutUrl);
      return true;
    }

    async function continueAfterSetup() {
      const redirected = await continueCheckoutIfNeeded();
      if (!redirected) {
        window.location.assign(nextPath);
      }
    }

    function resolveIcon(id) {
      return ICON_PRESETS.find((icon) => icon.id === id) || ICON_PRESETS[0];
    }

    function resolveBg(id) {
      return BG_PRESETS.find((bg) => bg.id === id) || BG_PRESETS[0];
    }

    function buildIconMarkup(icon, color) {
      return String(icon?.template || "").split("{{color}}").join(color);
    }

    function renderIconSvg(icon, color, size = 24) {
      return `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128' width='${size}' height='${size}' fill='none' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'>${buildIconMarkup(icon, color)}</svg>`;
    }

    function makeAvatarDataUri(bgStart, bgEnd, iconMarkup) {
      const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='${bgStart}'/><stop offset='100%' stop-color='${bgEnd}'/></linearGradient></defs><rect width='128' height='128' rx='64' fill='url(#g)'/><g fill='none' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'>${iconMarkup}</g></svg>`;
      return "data:image/svg+xml," + encodeURIComponent(svg);
    }

    function buildSelectedAvatar() {
      const bg = resolveBg(selectedBgId);
      const icon = resolveIcon(selectedIconId);
      const markup = buildIconMarkup(icon, "rgba(255,255,255,0.95)");
      return makeAvatarDataUri(bg.start, bg.end, markup);
    }

    function refreshAvatarPreview() {
      selectedAvatar = buildSelectedAvatar();
      avatarPreviewEl.src = selectedAvatar;
    }

    function renderIconOptions() {
      avatarIconGridEl.innerHTML = ICON_PRESETS.map((icon) => {
        const isActive = icon.id === selectedIconId;
        return `
          <button type="button" class="picker-btn${isActive ? " is-active" : ""}" data-icon-id="${icon.id}" aria-label="icon-${icon.label}">
            ${renderIconSvg(icon, "#e8f1ff", 24)}
          </button>`;
      }).join("");
    }

    function renderColorOptions() {
      avatarColorGridEl.innerHTML = BG_PRESETS.map((bg) => {
        const isActive = bg.id === selectedBgId;
        return `
          <button type="button" class="picker-btn${isActive ? " is-active" : ""}" data-bg-id="${bg.id}" aria-label="bg-${bg.label}">
            <span class="color-dot" style="background:linear-gradient(135deg, ${bg.start}, ${bg.end});"></span>
          </button>`;
      }).join("");
    }

    function initAvatarBuilder(existingAvatar = "") {
      renderIconOptions();
      renderColorOptions();
      if (existingAvatar) {
        selectedAvatar = existingAvatar;
        avatarPreviewEl.src = existingAvatar;
      } else {
        refreshAvatarPreview();
      }
    }

    avatarIconGridEl.addEventListener("click", (event) => {
      const target = event.target;
      if (!(target instanceof HTMLElement)) return;
      const option = target.closest("[data-icon-id]");
      if (!(option instanceof HTMLElement)) return;
      const iconId = String(option.getAttribute("data-icon-id") || "").trim();
      if (!iconId) return;
      selectedIconId = iconId;
      renderIconOptions();
      refreshAvatarPreview();
    });

    avatarColorGridEl.addEventListener("click", (event) => {
      const target = event.target;
      if (!(target instanceof HTMLElement)) return;
      const option = target.closest("[data-bg-id]");
      if (!(option instanceof HTMLElement)) return;
      const bgId = String(option.getAttribute("data-bg-id") || "").trim();
      if (!bgId) return;
      selectedBgId = bgId;
      renderColorOptions();
      refreshAvatarPreview();
    });

    const authPayload = readAuthState();
    if (!authPayload?.userId) {
      window.location.replace(buildAuthUrl());
    } else {
      sessionEmailEl.textContent = authPayload.email ? `Signed in as ${authPayload.email}` : "Signed in";
      const current = readUserState();
      if (hasProfileSetup(authPayload)) {
        continueAfterSetup().catch((error) => {
          setStatus(error?.message || "Unable to continue.", "error");
        });
      } else {
        initAvatarBuilder(String(current.avatar || ""));
        if (String(current.name || "").trim()) {
          setupNameInput.value = String(current.name || "").trim();
        }
      }
    }

    setupForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const payload = readAuthState();
      if (!payload?.userId) {
        window.location.replace(buildAuthUrl());
        return;
      }
      const name = String(setupNameInput.value || "").trim();
      if (name.length < 2) {
        setStatus("Name should be at least 2 characters.", "error");
        return;
      }

      setupSaveBtn.disabled = true;
      setStatus("Saving profile...", "");
      try {
        const current = readUserState();
        const nextState = {
          ...current,
          name,
          title: "Learner",
          level: Number.isFinite(Number(current.level)) ? Math.max(1, Math.floor(Number(current.level))) : 1,
          xp: Number.isFinite(Number(current.xp)) ? Math.max(0, Math.floor(Number(current.xp))) : 0,
          gems: Number.isFinite(Number(current.gems)) ? Math.max(0, Math.floor(Number(current.gems))) : 0,
          credits: Number.isFinite(Number(current.credits)) ? Math.max(0, Math.floor(Number(current.credits))) : DEFAULT_SIGNUP_CREDITS,
          streak: current.streak || "Day 1",
          avatar: selectedAvatar || buildSelectedAvatar()
        };
        writeUserState(nextState);
        await syncRegisteredUser(payload, nextState, "auth-profile-setup");
        saveProfileSetup(payload);
        setStatus("Profile saved. Redirecting...", "success");
        await continueAfterSetup();
      } catch (error) {
        setStatus(error?.message || "Failed to save profile.", "error");
      } finally {
        setupSaveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
