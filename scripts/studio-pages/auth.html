<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reado Auth</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-soft: #111c34;
      --panel: rgba(16, 24, 40, 0.9);
      --line: rgba(148, 163, 184, 0.25);
      --line-strong: rgba(125, 175, 255, 0.42);
      --text: #e5edff;
      --muted: #9fb0cc;
      --primary: #2563eb;
      --primary-strong: #1d4ed8;
      --danger: #ef4444;
      --ok: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 12%, rgba(37, 99, 235, 0.2), transparent 45%),
        radial-gradient(circle at 90% 8%, rgba(34, 197, 94, 0.12), transparent 34%),
        linear-gradient(180deg, #0f172a, #111c34 56%, #0f172a);
      display: flex;
      flex-direction: column;
    }
    .topbar {
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(15, 23, 42, 0.76);
      backdrop-filter: blur(10px);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(88, 173, 255, 0.4);
      background: rgba(19, 91, 236, 0.16);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #aecdff;
      font-family: "Material Icons";
      font-size: 20px;
      line-height: 1;
      font-weight: 400;
    }
    .top-link {
      color: #cfe0ff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(15, 23, 42, 0.35);
    }
    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }
    .auth-card {
      width: min(100%, 460px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 24px 50px rgba(2, 8, 23, 0.42);
      backdrop-filter: blur(10px);
      padding: 22px;
      display: grid;
      gap: 14px;
    }
    .eyebrow {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 800;
      color: #86b6ff;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -0.02em;
      font-weight: 800;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
    .oauth-btn,
    .email-submit,
    .switch-account-btn {
      border: 1px solid transparent;
      border-radius: 12px;
      min-height: 46px;
      width: 100%;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      color: #e5edff;
      transition: border-color 140ms ease, transform 140ms ease, background 140ms ease;
    }
    .oauth-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(30, 41, 59, 0.92);
      border-color: rgba(148, 163, 184, 0.36);
    }
    .oauth-btn:hover,
    .email-submit:hover,
    .switch-account-btn:hover {
      transform: translateY(-1px);
    }
    .oauth-btn:hover {
      border-color: rgba(152, 205, 255, 0.72);
    }
    .google-dot {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: conic-gradient(#ea4335 0 25%, #fbbc05 0 50%, #34a853 0 75%, #4285f4 0 100%);
      display: inline-grid;
      place-items: center;
      color: #fff;
      font-size: 10px;
      font-weight: 900;
    }
    .divider {
      margin: 2px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #8ca1c2;
      font-size: 13px;
      font-weight: 700;
    }
    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(148, 163, 184, 0.28);
    }
    .email-form {
      display: grid;
      gap: 10px;
    }
    .remember-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #bcd0ef;
      font-weight: 600;
      user-select: none;
    }
    .remember-row input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: #3b82f6;
    }
    .email-input {
      width: 100%;
      min-height: 46px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.42);
      background: rgba(15, 23, 42, 0.62);
      color: #e5edff;
      font-size: 16px;
      padding: 0 14px;
      outline: none;
    }
    .email-input::placeholder {
      color: #91a6c7;
    }
    .email-input:focus {
      border-color: rgba(125, 175, 255, 0.88);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }
    .email-submit {
      background: linear-gradient(180deg, var(--primary), var(--primary-strong));
      border-color: rgba(125, 175, 255, 0.7);
    }
    .email-submit[disabled],
    .oauth-btn[disabled],
    .switch-account-btn[disabled] {
      opacity: 0.66;
      cursor: not-allowed;
      transform: none;
    }
    .status {
      min-height: 20px;
      margin: 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }
    .status.success { color: var(--ok); }
    .status.error { color: var(--danger); }
    .signed-box {
      border: 1px solid rgba(125, 175, 255, 0.38);
      border-radius: 12px;
      background: rgba(29, 78, 216, 0.14);
      padding: 12px;
      display: grid;
      gap: 10px;
    }
    .signed-box[hidden] {
      display: none !important;
    }
    .signed-email {
      margin: 0;
      font-size: 13px;
      color: #d8e6ff;
      word-break: break-all;
    }
    .switch-account-btn {
      background: rgba(15, 23, 42, 0.68);
      border-color: rgba(148, 163, 184, 0.36);
      font-size: 14px;
      min-height: 40px;
    }
    .bottom-note {
      margin: 0;
      font-size: 12px;
      color: #8ca1c2;
      line-height: 1.5;
    }
    @media (max-width: 640px) {
      .topbar {
        height: 64px;
        padding: 0 12px;
      }
      .brand {
        font-size: 32px;
      }
      .brand-mark {
        width: 30px;
        height: 30px;
        font-size: 17px;
      }
      .auth-card {
        border-radius: 16px;
        padding: 18px;
      }
      h1 {
        font-size: 24px;
      }
    }
  </style>
  <script defer src="https://umami-production-9f03.up.railway.app/script.js" data-website-id="a7e6844a-97e6-4878-bf40-5a18520d1310"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/pages/playable-studio.html" aria-label="reado home">
      <span class="brand-mark">auto_stories</span>
      <span>reado</span>
    </a>
    <a class="top-link" href="/pages/playable-studio.html">Back to app</a>
  </header>

  <main>
    <section class="auth-card" aria-label="Authentication">
      <p id="authEyebrow" class="eyebrow"></p>
      <h1 id="authTitle"></h1>
      <p id="authSubtitle" class="subtitle"></p>

      <button id="googleBtn" class="oauth-btn" type="button">
        <span class="google-dot">G</span>
        <span id="googleBtnLabel">Continue with Google</span>
      </button>

      <div class="divider">or</div>

      <form id="emailForm" class="email-form">
        <input id="emailInput" class="email-input" type="email" autocomplete="email" placeholder="Enter your email" required>
        <label class="remember-row">
          <input id="rememberMeInput" type="checkbox" checked>
          <span>Remember me</span>
        </label>
        <button id="emailBtn" class="email-submit" type="submit">Send magic link</button>
      </form>

      <p id="statusText" class="status"></p>

      <section id="signedBox" class="signed-box" hidden>
        <p id="signedEmail" class="signed-email"></p>
        <button id="switchAccountBtn" class="switch-account-btn" type="button">Use another account</button>
      </section>

      <p class="bottom-note">By continuing, you agree to Reado terms and privacy policy.</p>
    </section>
  </main>

  <script type="module">
    const AUTH_STATE_KEY = "reado_auth_state_v1";
    const USER_STATE_KEY = "reado_user_state_v1";
    const PROFILE_SETUP_KEY = "reado_profile_setup_v1";
    const AUTH_REMEMBER_KEY = "reado_auth_remember_v1";
    const FALLBACK_NEXT = "/pages/playable-studio.html";

    const params = new URLSearchParams(window.location.search);
    const rawMode = String(params.get("mode") || "").trim().toLowerCase();
    const authMode = rawMode === "signup" ? "signup" : "signin";
    const intent = String(params.get("intent") || "").trim();
    const pendingPriceId = String(params.get("priceId") || "").trim();

    const authEyebrowEl = document.getElementById("authEyebrow");
    const authTitleEl = document.getElementById("authTitle");
    const authSubtitleEl = document.getElementById("authSubtitle");
    const googleBtn = document.getElementById("googleBtn");
    const googleBtnLabel = document.getElementById("googleBtnLabel");
    const emailForm = document.getElementById("emailForm");
    const emailInput = document.getElementById("emailInput");
    const rememberMeInput = document.getElementById("rememberMeInput");
    const emailBtn = document.getElementById("emailBtn");
    const statusTextEl = document.getElementById("statusText");
    const signedBoxEl = document.getElementById("signedBox");
    const signedEmailEl = document.getElementById("signedEmail");
    const switchAccountBtn = document.getElementById("switchAccountBtn");

    let supabase = null;
    let redirecting = false;
    let handledSessionKey = "";

    function setModeCopy() {
      if (authMode === "signup") {
        authEyebrowEl.textContent = "Create account";
        authTitleEl.textContent = "Sign up to start";
        authSubtitleEl.textContent = "Create your account first. We only ask profile setup once.";
      } else {
        authEyebrowEl.textContent = "Welcome back";
        authTitleEl.textContent = "Sign in to continue";
        authSubtitleEl.textContent = "Sign in and we will take you back to your previous page.";
      }
      googleBtnLabel.textContent = authMode === "signup" ? "Continue with Google" : "Sign in with Google";
      emailBtn.textContent = authMode === "signup" ? "Sign up with email" : "Sign in with email";
    }

    function setStatus(message, type = "") {
      statusTextEl.textContent = message || "";
      statusTextEl.className = "status" + (type ? " " + type : "");
    }

    function sanitizeNextPath(raw) {
      const value = String(raw || "").trim();
      if (!value) return FALLBACK_NEXT;
      try {
        const full = new URL(value, window.location.origin);
        if (full.origin !== window.location.origin) return FALLBACK_NEXT;
        return full.pathname + full.search + full.hash;
      } catch {
        return FALLBACK_NEXT;
      }
    }

    const nextPath = sanitizeNextPath(params.get("next"));

    function buildAuthReturnUrl() {
      const url = new URL("/pages/auth.html", window.location.origin);
      url.searchParams.set("mode", authMode);
      url.searchParams.set("next", nextPath);
      if (intent === "checkout" && pendingPriceId) {
        url.searchParams.set("intent", "checkout");
        url.searchParams.set("priceId", pendingPriceId);
      }
      return url.toString();
    }

    function buildProfileSetupUrl() {
      const url = new URL("/pages/profile-setup.html", window.location.origin);
      url.searchParams.set("next", nextPath);
      if (intent === "checkout" && pendingPriceId) {
        url.searchParams.set("intent", "checkout");
        url.searchParams.set("priceId", pendingPriceId);
      }
      return url.toString();
    }

    function readUserState() {
      try {
        const raw = JSON.parse(localStorage.getItem(USER_STATE_KEY) || "null");
        return raw && typeof raw === "object" ? raw : {};
      } catch {
        return {};
      }
    }

    function dispatchAuthStateChanged(signedIn, payload) {
      window.dispatchEvent(new CustomEvent("reado:auth-state-changed", {
        detail: {
          signedIn: Boolean(signedIn),
          payload: payload && typeof payload === "object" ? payload : null
        }
      }));
    }

    function readRememberPreference() {
      const raw = String(localStorage.getItem(AUTH_REMEMBER_KEY) || "").trim().toLowerCase();
      return raw !== "0";
    }

    function saveRememberPreference(value) {
      localStorage.setItem(AUTH_REMEMBER_KEY, value ? "1" : "0");
    }

    function persistAuthState(session) {
      const user = session?.user || {};
      const expiresAtSeconds = Number(session?.expires_at);
      const rememberMe = readRememberPreference();
      const sessionExpiresAt = Number.isFinite(expiresAtSeconds) ? expiresAtSeconds * 1000 : 0;
      const localFallback = Date.now() + (rememberMe ? 1000 * 60 * 60 * 24 * 30 : 1000 * 60 * 60 * 12);
      const expiresAt = rememberMe
        ? (sessionExpiresAt || localFallback)
        : Math.min(sessionExpiresAt || localFallback, localFallback);
      const payload = {
        userId: typeof user.id === "string" ? user.id : "",
        email: typeof user.email === "string" ? user.email : "",
        provider: typeof user?.app_metadata?.provider === "string" ? user.app_metadata.provider : "",
        expiresAt,
        updatedAt: new Date().toISOString()
      };
      localStorage.setItem(AUTH_STATE_KEY, JSON.stringify(payload));
      dispatchAuthStateChanged(true, payload);
      return payload;
    }

    function clearAuthState() {
      localStorage.removeItem(AUTH_STATE_KEY);
      dispatchAuthStateChanged(false, null);
    }

    function hasProfileSetup(payload) {
      if (!payload?.userId) return false;
      try {
        const setup = JSON.parse(localStorage.getItem(PROFILE_SETUP_KEY) || "null");
        if (!setup || typeof setup !== "object") return false;
        if (setup.userId !== payload.userId || setup.done !== true) return false;
      } catch {
        return false;
      }
      const userState = readUserState();
      const name = String(userState?.name || "").trim();
      const avatar = String(userState?.avatar || "").trim();
      return Boolean(name && avatar);
    }

    async function syncRegisteredUser(authPayload, state, reason = "auth-sync") {
      const userId = String(authPayload?.userId || "").trim();
      if (!userId) return null;
      const userState = state && typeof state === "object" ? state : readUserState();
      const body = {
        userId,
        email: String(authPayload?.email || "").trim(),
        displayName: String(userState?.name || "").trim(),
        state: {
          level: Number.isFinite(Number(userState?.level)) ? Math.max(1, Math.floor(Number(userState.level))) : 1,
          xp: Number.isFinite(Number(userState?.xp)) ? Math.max(0, Math.floor(Number(userState.xp))) : 0,
          gems: Number.isFinite(Number(userState?.gems)) ? Math.max(0, Math.floor(Number(userState.gems))) : 0
        },
        reason: String(reason || "").trim()
      };
      try {
        const response = await fetch("/api/user/sync", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify(body)
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data?.ok === false) return null;
        return data;
      } catch {
        return null;
      }
    }

    async function continueCheckoutIfNeeded() {
      if (intent !== "checkout" || !pendingPriceId) return false;
      const response = await fetch("/api/billing/checkout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ priceId: pendingPriceId })
      });
      let data = {};
      try { data = await response.json(); } catch {}
      if (!response.ok || data?.ok === false) {
        throw new Error(data?.error || `Checkout failed with ${response.status}`);
      }
      const checkoutUrl = String(data?.checkoutUrl || "").trim();
      if (!checkoutUrl) throw new Error("Stripe checkout URL is empty");
      window.location.assign(checkoutUrl);
      return true;
    }

    function renderSignedBox(payload) {
      signedBoxEl.hidden = false;
      signedEmailEl.textContent = payload?.email
        ? `Signed in as ${payload.email}`
        : "Signed in. Redirecting...";
    }

    async function routeAfterSignIn(payload) {
      if (redirecting) return;
      redirecting = true;
      renderSignedBox(payload);
      setStatus("Signed in. Redirecting...", "success");

      if (!hasProfileSetup(payload)) {
        window.location.assign(buildProfileSetupUrl());
        return;
      }

      await syncRegisteredUser(payload, readUserState(), "auth-signin");
      const redirectedToCheckout = await continueCheckoutIfNeeded();
      if (!redirectedToCheckout) {
        window.location.assign(nextPath);
      }
    }

    async function handleSignedInSession(session) {
      const userId = String(session?.user?.id || "").trim();
      const expiresAt = Number(session?.expires_at) || 0;
      const sessionKey = userId + ":" + String(expiresAt);
      if (!userId) return;
      if (sessionKey && sessionKey === handledSessionKey && redirecting) return;
      handledSessionKey = sessionKey;
      const payload = persistAuthState(session);
      try {
        await routeAfterSignIn(payload);
      } catch (error) {
        redirecting = false;
        setStatus(error?.message || "Signed in, but redirect failed.", "error");
      }
    }

    async function setupSupabase() {
      setStatus("Loading authentication...", "");
      const configRes = await fetch("/api/auth/config", { credentials: "same-origin" });
      const config = await configRes.json().catch(() => ({}));
      const auth = config?.auth || {};
      const supabaseUrl = String(auth?.supabaseUrl || "").trim();
      const supabaseAnonKey = String(auth?.supabaseAnonKey || "").trim();
      if (!configRes.ok || !config?.enabled || !supabaseUrl || !supabaseAnonKey) {
        throw new Error("Auth is not configured. Set SUPABASE_URL and SUPABASE_ANON_KEY on Railway.");
      }

      const supabasePkg = await import("https://esm.sh/@supabase/supabase-js@2");
      supabase = supabasePkg.createClient(supabaseUrl, supabaseAnonKey, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      });

      supabase.auth.onAuthStateChange(async (event, session) => {
        if (!session) {
          if (event === "SIGNED_OUT") {
            redirecting = false;
            handledSessionKey = "";
            signedBoxEl.hidden = true;
            setStatus("Signed out. You can sign in with another account.", "");
          }
          clearAuthState();
          return;
        }
        await handleSignedInSession(session);
      });

      const { data, error } = await supabase.auth.getSession();
      if (error) throw error;
      if (data?.session) {
        await handleSignedInSession(data.session);
      } else {
        clearAuthState();
        signedBoxEl.hidden = true;
        setStatus("Use Google or email magic link to continue.", "");
      }
    }

    googleBtn.addEventListener("click", async () => {
      if (!supabase) return;
      setStatus("Redirecting to Google...", "");
      googleBtn.disabled = true;
      emailBtn.disabled = true;
      try {
        const { error } = await supabase.auth.signInWithOAuth({
          provider: "google",
          options: { redirectTo: buildAuthReturnUrl() }
        });
        if (error) throw error;
      } catch (error) {
        setStatus(error?.message || "Google sign-in failed.", "error");
        googleBtn.disabled = false;
        emailBtn.disabled = false;
      }
    });

    emailForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!supabase) return;
      const email = String(emailInput.value || "").trim();
      if (!email) {
        setStatus("Please enter your email address.", "error");
        return;
      }
      setStatus("Sending magic link...", "");
      emailBtn.disabled = true;
      googleBtn.disabled = true;
      try {
        const { error } = await supabase.auth.signInWithOtp({
          email,
          options: { emailRedirectTo: buildAuthReturnUrl() }
        });
        if (error) throw error;
        setStatus("Magic link sent. Please check your inbox.", "success");
      } catch (error) {
        setStatus(error?.message || "Email sign-in failed.", "error");
      } finally {
        if (!redirecting) {
          emailBtn.disabled = false;
          googleBtn.disabled = false;
        }
      }
    });

    switchAccountBtn.addEventListener("click", async () => {
      if (!supabase) return;
      switchAccountBtn.disabled = true;
      try {
        await supabase.auth.signOut();
      } finally {
        switchAccountBtn.disabled = false;
      }
    });

    setModeCopy();
    rememberMeInput.checked = readRememberPreference();
    rememberMeInput.addEventListener("change", () => {
      saveRememberPreference(Boolean(rememberMeInput.checked));
    });
    setupSupabase().catch((error) => {
      setStatus(error?.message || "Failed to initialize auth.", "error");
      googleBtn.disabled = true;
      emailBtn.disabled = true;
      emailInput.disabled = true;
      rememberMeInput.disabled = true;
      switchAccountBtn.disabled = true;
    });
  </script>
</body>
</html>
